<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Token reCAPTCHA v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Oculta la insignia flotante de reCAPTCHA por defecto para un diseño más limpio (Opcional) */
        .grecaptcha-badge {
            visibility: hidden;
        }
    </style>

    <!--
      ======================================================================
      PASO 1: REEMPLAZA "TU_CLAVE_DE_SITIO_FRONTEND" CON TU SITE KEY REAL
      ======================================================================
    -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LcV474tAAAAANTyOdTptREgDpWFqrpS_iCVWGP1"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-gray-800">Prueba reCAPTCHA v3</h1>
            <p class="text-sm text-gray-500 mt-2">Completa el formulario para generar un token válido para Postman.</p>
        </div>

        <form id="demo-form" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                <input type="text" id="name" name="name" required placeholder="Ej. Juan Pérez"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="juan@ejemplo.com"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <button type="submit" id="submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                <span id="btn-text">Generar Token</span>
                <svg id="btn-spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <!-- Contenedor del Token (Oculto por defecto) -->
        <div id="result-container" class="mt-8 hidden opacity-0 transition-opacity duration-500">
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Token Generado</span>
                    <button id="copy-btn" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-1 px-3 rounded transition-colors">
                        Copiar
                    </button>
                </div>
                <textarea id="token-display" readonly rows="5"
                          class="w-full text-sm font-mono bg-white border border-gray-200 rounded p-2 text-gray-700 resize-none outline-none focus:ring-1 focus:ring-blue-500"></textarea>
                <p class="text-xs text-amber-600 mt-2 font-medium">
                    ⚠️ Recuerda: Este token expira en 2 minutos. Úsalo rápido en Postman.
                </p>
            </div>
        </div>
    </div>

    <script>
        // ======================================================================
        // PASO 2: REEMPLAZA ESTA VARIABLE CON TU SITE KEY REAL
        // ======================================================================
        const SITE_KEY = '6LcV474tAAAAANTyOdTptREgDpWFqrpS_iCVWGP1';

        // Referencias a los elementos del DOM
        const form = document.getElementById('demo-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const resultContainer = document.getElementById('result-container');
        const tokenDisplay = document.getElementById('token-display');
        const copyBtn = document.getElementById('copy-btn');

        // Manejador del evento de envío del formulario
        form.addEventListener('submit', function(e) {
            // Prevenir que el formulario recargue la página
            e.preventDefault();

            // Interfaz: Mostrar estado de carga
            btnText.textContent = 'Generando...';
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            // Lógica programática de reCAPTCHA v3
            try {
                grecaptcha.ready(function() {
                    // Ejecutar reCAPTCHA con la acción 'submit'
                    grecaptcha.execute(SITE_KEY, { action: 'submit' }).then(function(token) {

                        // Mostrar el token en la interfaz
                        tokenDisplay.value = token;

                        // Hacer visible el contenedor del resultado
                        resultContainer.classList.remove('hidden');
                        // Pequeño delay para la animación de opacidad
                        setTimeout(() => resultContainer.classList.remove('opacity-0'), 50);

                        // Restaurar botón
                        resetButton();
                    }).catch(function(error) {
                        console.error('Error al ejecutar reCAPTCHA:', error);
                        tokenDisplay.value = "Error al generar el token. Verifica que tu Site Key sea correcta y que estés ejecutando esto en un entorno permitido (localhost o dominio registrado).";
                        resultContainer.classList.remove('hidden', 'opacity-0');
                        resetButton();
                    });
                });
            } catch (error) {
                console.error('El script de reCAPTCHA no se cargó correctamente.', error);
                resetButton();
            }
        });

        // Función auxiliar para restaurar el botón
        function resetButton() {
            btnText.textContent = 'Generar Token';
            btnSpinner.classList.add('hidden');
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }

        // Lógica para copiar el token al portapapeles
        copyBtn.addEventListener('click', function() {
            tokenDisplay.select();
            document.execCommand('copy'); // Método compatible para iframes y navegadores antiguos

            // Feedback visual
            const originalText = this.textContent;
            this.textContent = '¡Copiado!';
            this.classList.replace('bg-gray-200', 'bg-green-100');
            this.classList.replace('text-gray-700', 'text-green-700');

            setTimeout(() => {
                this.textContent = originalText;
                this.classList.replace('bg-green-100', 'bg-gray-200');
                this.classList.replace('text-green-700', 'text-gray-700');
            }, 2000);
        });
    </script>
</body>
</html>
